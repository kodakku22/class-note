appId: com.adati.classnotes
productName: ClassNotes
directories:
  output: release
files:
  - dist
  - dist-electron
  - package.json
  - "!**/*.map"
  - "!**/*.ts"
  - "!**/*.tsx"
  - "!**/*.md"
  - "!**/test/**"
  - "!**/tests/**"
  - "!node_modules/@mermaid-js/**"
  - "!node_modules/@tiptap/**"
  - "!node_modules/@types/**"
  - "!node_modules/@xyflow/**"
  - "!node_modules/cytoscape/**"
  - "!node_modules/d3-*/**"
  - "!node_modules/highlight.js/**"
  - "!node_modules/katex/**"
  - "!node_modules/lodash-es/**"
  - "!node_modules/mermaid/**"
  - "!node_modules/pdfjs-dist/**"
  - "!node_modules/react/**"
  - "!node_modules/react-dom/**"
  - "!node_modules/react-markdown/**"
  - "!node_modules/react-pdf/**"
  - "!node_modules/rehype-*/**"
  - "!node_modules/remark-*/**"
  - "!node_modules/scheduler/**"
  - "!node_modules/tiptap-markdown/**"
  - "!node_modules/zustand/**"
win:
  icon: build/icon.ico
  target:
    - target: portable
    - target: nsis
  artifactName: ClassNotes-${version}-${env.ARTIFACT_KIND}.${ext}
  # Code signing — driven by env vars set in .github/workflows/release.yml.
  # CSC_LINK (decoded .pfx path) and CSC_KEY_PASSWORD must be set in CI.
  # If left unset, electron-builder produces an UNSIGNED build (auto-updater
  # will refuse such builds — see docs/release-signing.md).
  signingHashAlgorithms:
    - sha256
  signAndEditExecutable: true
portable:
  artifactName: ClassNotes-${version}-Portable.exe
nsis:
  artifactName: ClassNotes-${version}-Setup.exe
  oneClick: false
  allowToChangeInstallationDirectory: true
# Auto-update channel. electron-updater reads latest.yml from the GitHub
# Releases page configured below. The release workflow uploads latest.yml +
# signed installers automatically when a v* tag is pushed.
publish:
  provider: github
  owner: kodakku22
  repo: class-note
  releaseType: release
asarUnpack:
  # pdfjs-dist ships a WebWorker that must remain unpacked so it can be loaded
  # by a separate process (asar archives are not loadable as Workers).
  - "**/pdfjs-dist/build/pdf.worker*"
  # mermaid uses WASM internally — keep WASM payloads outside asar so the
  # runtime mmap loader works.
  - "**/*.wasm"
